# ============================================================================
# 脑区参数模板 (同一调质在不同脑区的时间常数/摄取参数不同)
# 权威依据: Ford 2010 (DA VTA vs striatum), Breton-Provencher 2022 (NE LC)
# ============================================================================
brain_regions:
  VTA:              # 腹侧被盖区 - DA 神经元胞体
    DA: {decay_tau: 0.500, v_max: 2.0, k_m: 0.4}     # 慢衰减 (扩散为主)
    GABA: {decay_tau: 0.300, v_max: 3.0, k_m: 0.3}
  striatum:         # 纹状体 - DA 终末, DAT 高表达
    DA: {decay_tau: 0.200, v_max: 5.0, k_m: 0.3}     # 快衰减 (DAT 重摄取)
    ACh: {decay_tau: 0.200, v_max: 8.0, k_m: 0.2}    # AChE 极快降解
  PFC:              # 前额叶 - 执行控制
    DA: {decay_tau: 0.300, v_max: 3.0, k_m: 0.35}
    NE: {decay_tau: 0.500, v_max: 3.0, k_m: 0.4}
    ACh: {decay_tau: 0.300, v_max: 5.0, k_m: 0.3}
  amygdala:         # 杏仁核 - 恐惧/情绪
    NE: {decay_tau: 0.400, v_max: 4.0, k_m: 0.4}
    5HT: {decay_tau: 2.0, v_max: 2.0, k_m: 0.5}
    GABA: {decay_tau: 0.250, v_max: 4.0, k_m: 0.3}
  hippocampus:      # 海马 - 记忆
    ACh: {decay_tau: 0.250, v_max: 6.0, k_m: 0.25}
    5HT: {decay_tau: 2.5, v_max: 1.5, k_m: 0.5}
  hypothalamus:     # 下丘脑 - 催产素
    Oxy: {decay_tau: 10.0, v_max: 0.5, k_m: 0.6}
  insula:           # 岛叶 - 厌恶/内感受 (Calder 2001)
    5HT: {decay_tau: 2.0, v_max: 2.0, k_m: 0.5}
    DA: {decay_tau: 0.300, v_max: 3.0, k_m: 0.35}

# ============================================================================
# 基础调质参数 (各场景默认, 可被脑区和场景覆盖)
# ============================================================================
base_params:
  DA:    {rise_tau: 0.050, baseline: 0.0,  noise_std: 0.015}
  5HT:   {rise_tau: 0.200, baseline: 0.0,  noise_std: 0.012}
  NE:    {rise_tau: 0.080, baseline: 0.0,  noise_std: 0.018}
  ACh:   {rise_tau: 0.100, baseline: 0.02, noise_std: 0.010}
  Oxy:   {rise_tau: 1.000, baseline: 0.01, noise_std: 0.008}

# ============================================================================
# 强度梯度模板 (peak_df 和 poisson_rate 的缩放因子)
# ============================================================================
# ==================== 强度梯度系统 (-50 到 +50) ====================
# 线性映射: scale = max(0.05, 1.0 + intensity * 0.02)
#   intensity = -50 → scale = 0.05 (最弱, 钳位防全零)
#   intensity = -25 → scale = 0.50 (原 weak)
#   intensity =   0 → scale = 1.00 (基准, 原 medium)
#   intensity = +25 → scale = 1.50 (原 strong)
#   intensity = +50 → scale = 2.00 (最强)
# peak_scale 和 rate_scale 都用同一公式, 保证刺激频率与幅度同步缩放.
intensity_levels:
  _mode: linear_integer       # 整数线性映射模式
  _range: [-50, 50]           # 整数范围
  _formula: "scale = max(0.05, 1.0 + intensity * 0.02)"
  # 兼容旧版命名 (代码会自动转换):
  legacy_weak:   -25          # 等价于 scale=0.5
  legacy_medium: 0            # 等价于 scale=1.0
  legacy_strong: 25           # 等价于 scale=1.5

# ============================================================================
# 阶段模板 (时间结构: baseline → CS → US → recovery)
# ============================================================================
phase_templates:
  default:
    baseline:  {start: 0,    duration: 10,  description: "基线期"}
    CS:        {start: 10,   duration: 5,   description: "条件刺激"}
    US:        {start: 15,   duration: 2,   description: "无条件刺激"}
    recovery:  {start: 17,   duration: 283, description: "恢复期 (A2: 延长至 300s 总时长)"}
  fear_conditioning:
    baseline:  {start: 0,    duration: 10,  description: "基线期"}
    CS:        {start: 10,   duration: 30,  description: "CS+ 恐惧线索"}
    US:        {start: 40,   duration: 2,   description: "足底电击"}
    recovery:  {start: 42,   duration: 258, description: "恢复期 (A2)"}
  social_defeat:
    baseline:  {start: 0,    duration: 10,  description: "基线期"}
    CS:        {start: 10,   duration: 5,   description: "入侵者出现"}
    US:        {start: 15,   duration: 60,  description: "社交失败"}
    recovery:  {start: 75,   duration: 225, description: "恢复期 (A2)"}
  fear_reconsolidation:
    baseline:  {start: 0,    duration: 10,  description: "基线期"}
    CS:        {start: 10,   duration: 5,   description: "记忆再激活线索"}
    US:        {start: 15,   duration: 10,  description: "再巩固窗口 (NE 关键)"}
    recovery:  {start: 25,   duration: 275, description: "再巩固完成期 (A2)"}

# ============================================================================
# 72 个场景预设 (22 原有 + 50 新增)
# ============================================================================
presets:

  # ==================== 奖赏类 (4) ====================

  reward_anticipation:
    description: "奖赏预期 - CS+ 出现时 DA 渐升 (Schultz 1997)"
    paradigm: "Pavlovian conditioning"
    behavior: "approach_behavior"
    brain_region: "VTA"
    expected_state: {pleasure: medium, arousal: medium, dominance: high}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.08,  peak_df: [0.20, 0.35], stim_duration: 0.05, phase: CS}
      5HT:   {stim_type: plateau, poisson_rate: 0.01,  peak_df: [0.05, 0.10], stim_duration: 15,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.03,  peak_df: [0.10, 0.15], stim_duration: 0.08, phase: CS}
      ACh:   {stim_type: ramp,    poisson_rate: 0.03,  peak_df: [0.15, 0.25], stim_duration: 15,   phase: CS}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.01,  peak_df: [0.05, 0.10], stim_duration: 20,   phase: recovery}

  reward_delivery:
    description: "奖赏获得 - US 到达时 DA 尖峰 (Schultz 1997)"
    paradigm: "Pavlovian conditioning - reward delivery"
    behavior: "consummatory_behavior"
    brain_region: "striatum"
    expected_state: {pleasure: high, arousal: medium, dominance: high}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.20,  peak_df: [0.40, 0.60], stim_duration: 0.05, phase: US}
      5HT:   {stim_type: plateau, poisson_rate: 0.01,  peak_df: [0.05, 0.10], stim_duration: 10,   phase: recovery}
      NE:    {stim_type: pulse,   poisson_rate: 0.05,  peak_df: [0.15, 0.25], stim_duration: 0.08, phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.03,  peak_df: [0.20, 0.30], stim_duration: 20,   phase: recovery}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.02,  peak_df: [0.10, 0.15], stim_duration: 20,   phase: recovery}

  reward_omission:
    description: "奖赏遗漏 - 预期但未获得, DA 突降 (Schultz 1997)"
    paradigm: "Pavlovian conditioning - reward omission"
    behavior: "frustration_behavior"
    brain_region: "VTA"
    expected_state: {pleasure: low, arousal: medium, dominance: low}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.02,  peak_df: [0.05, 0.10], stim_duration: 0.05, phase: CS}
      5HT:   {stim_type: plateau, poisson_rate: 0.05,  peak_df: [0.20, 0.35], stim_duration: 15,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.08,  peak_df: [0.20, 0.30], stim_duration: 0.08, phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.04,  peak_df: [0.20, 0.35], stim_duration: 15,   phase: CS}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.01,  peak_df: [0.02, 0.05], stim_duration: 20,   phase: recovery}

  reward_extinction:
    description: "奖赏消退 - 重复无奖赏, DA 渐降"
    paradigm: "Extinction learning"
    behavior: "extinction_learning"
    brain_region: "PFC"
    expected_state: {pleasure: low_medium, arousal: low, dominance: medium}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.03,  peak_df: [0.08, 0.15], stim_duration: 0.05, phase: CS}
      5HT:   {stim_type: plateau, poisson_rate: 0.03,  peak_df: [0.15, 0.25], stim_duration: 30,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.03,  peak_df: [0.10, 0.15], stim_duration: 0.08, phase: CS}
      ACh:   {stim_type: ramp,    poisson_rate: 0.05,  peak_df: [0.30, 0.45], stim_duration: 40,   phase: CS}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.01,  peak_df: [0.05, 0.10], stim_duration: 30,   phase: recovery}

  # ==================== 应激类 (4) ====================

  stress_acute_looming:
    description: "急性威胁 - looming 刺激, NE 快速峰值 (Breton-Provencher 2022)"
    paradigm: "Looming threat"
    behavior: "freezing_flight"
    brain_region: "amygdala"
    expected_state: {pleasure: low, arousal: high, dominance: low}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.03,  peak_df: [0.05, 0.15], stim_duration: 0.05, phase: US}
      5HT:   {stim_type: plateau, poisson_rate: 0.05,  peak_df: [0.30, 0.50], stim_duration: 30,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.20,  peak_df: [0.50, 0.70], stim_duration: 0.08, phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.02,  peak_df: [0.10, 0.20], stim_duration: 15,   phase: recovery}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.01,  peak_df: [0.02, 0.05], stim_duration: 20,   phase: recovery}

  stress_chronic_unpredictable:
    description: "慢性不可预测应激 - 5HT 持续升高 (Willner 2017)"
    paradigm: "Chronic unpredictable mild stress"
    behavior: "behavioral_despair"
    brain_region: "hippocampus"
    expected_state: {pleasure: very_low, arousal: medium_high, dominance: very_low}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.02,  peak_df: [0.03, 0.08], stim_duration: 0.05, phase: US}
      5HT:   {stim_type: plateau, poisson_rate: 0.08,  peak_df: [0.40, 0.60], stim_duration: 90,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.10,  peak_df: [0.30, 0.45], stim_duration: 0.08, phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.02,  peak_df: [0.10, 0.20], stim_duration: 30,   phase: recovery}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.005, peak_df: [0.01, 0.03], stim_duration: 30,   phase: recovery}

  stress_restraint:
    description: "约束应激 - NE 持续中等升高"
    paradigm: "Restraint stress"
    behavior: "struggle_immobility"
    brain_region: "PFC"
    expected_state: {pleasure: low, arousal: high, dominance: low}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.02,  peak_df: [0.05, 0.10], stim_duration: 0.05, phase: US}
      5HT:   {stim_type: plateau, poisson_rate: 0.03,  peak_df: [0.20, 0.35], stim_duration: 60,   phase: US}
      NE:    {stim_type: plateau, poisson_rate: 0.05,  peak_df: [0.35, 0.50], stim_duration: 60,   phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.03,  peak_df: [0.15, 0.25], stim_duration: 30,   phase: recovery}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.01,  peak_df: [0.03, 0.08], stim_duration: 30,   phase: recovery}

  stress_social_defeat:
    description: "社交失败 - DA低 + 5HT高 + Oxy低 (Krishnan 2007)"
    paradigm: "Social defeat stress"
    behavior: "social_avoidance"
    brain_region: "amygdala"
    phase_template: "social_defeat"
    expected_state: {pleasure: very_low, arousal: high, dominance: very_low}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.01,  peak_df: [0.02, 0.05], stim_duration: 0.05, phase: US}
      5HT:   {stim_type: plateau, poisson_rate: 0.06,  peak_df: [0.40, 0.60], stim_duration: 60,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.15,  peak_df: [0.45, 0.65], stim_duration: 0.08, phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.02,  peak_df: [0.08, 0.15], stim_duration: 30,   phase: recovery}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.005, peak_df: [0.01, 0.03], stim_duration: 30,   phase: recovery}

  # ==================== 社交类 (4) ====================

  social_investigation:
    description: "社交探究 - Oxy 中频 burst (Lee 2009)"
    paradigm: "Social investigation"
    behavior: "sniffing_approach"
    brain_region: "hypothalamus"
    expected_state: {pleasure: medium, arousal: medium, dominance: medium}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.06,  peak_df: [0.15, 0.25], stim_duration: 0.05, phase: CS}
      5HT:   {stim_type: plateau, poisson_rate: 0.02,  peak_df: [0.10, 0.20], stim_duration: 20,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.04,  peak_df: [0.12, 0.20], stim_duration: 0.08, phase: CS}
      ACh:   {stim_type: ramp,    poisson_rate: 0.03,  peak_df: [0.15, 0.25], stim_duration: 20,   phase: CS}
      Oxy:   {stim_type: pulse,   poisson_rate: 0.10,  peak_df: [0.20, 0.35], stim_duration: 1.0,  phase: CS}

  social_bonding:
    description: "社交依恋 - Oxy 持续上升 + DA 中等 (Insel 2010)"
    paradigm: "Pair bonding"
    behavior: "pair_bonding"
    brain_region: "hypothalamus"
    expected_state: {pleasure: high, arousal: low_medium, dominance: medium_high}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.06,  peak_df: [0.20, 0.30], stim_duration: 0.05, phase: US}
      5HT:   {stim_type: plateau, poisson_rate: 0.02,  peak_df: [0.08, 0.15], stim_duration: 30,   phase: recovery}
      NE:    {stim_type: pulse,   poisson_rate: 0.02,  peak_df: [0.08, 0.12], stim_duration: 0.08, phase: CS}
      ACh:   {stim_type: ramp,    poisson_rate: 0.03,  peak_df: [0.15, 0.25], stim_duration: 30,   phase: US}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.05,  peak_df: [0.35, 0.50], stim_duration: 60,   phase: US}

  social_isolation:
    description: "社交隔离 - Oxy 低基线 + DA 低 (Grippo 2007)"
    paradigm: "Social isolation"
    behavior: "isolation_distress"
    brain_region: "hypothalamus"
    expected_state: {pleasure: low, arousal: medium, dominance: low}
    modulators:
      DA:    {stim_type: pulse,   poisson_rate: 0.02,  peak_df: [0.05, 0.10], stim_duration: 0.05, phase: baseline}
      5HT:   {stim_type: plateau, poisson_rate: 0.03,  peak_df: [0.15, 0.25], stim_duration: 90,   phase: baseline}
      NE:    {stim_type: pulse,   poisson_rate: 0.03,  peak_df: [0.10, 0.15], stim_duration: 0.08, phase: baseline}
      ACh:   {stim_type: ramp,    poisson_rate: 0.02,  peak_df: [0.10, 0.15], stim_duration: 30,   phase: baseline}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.005, peak_df: [0.01, 0.03], stim_duration: 90,   phase: baseline}

  social_rejection:
    description: "社交排斥 - DA 突降 + 5HT 上升 (Eisenberger 2003)"
    paradigm: "Social rejection (Cyberball)"
    behavior: "social_withdrawal"
    brain_region: "amygdala"
    expected_state: {pleasure: very_low, arousal: medium, dominance: very_low}
    modulators:
