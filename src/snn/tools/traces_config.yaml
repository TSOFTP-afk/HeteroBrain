      5HT:   {stim_type: plateau, poisson_rate: 0.06,  peak_df: [0.35, 0.55], stim_duration: 30,   phase: US}
      NE:    {stim_type: pulse,   poisson_rate: 0.08,  peak_df: [0.25, 0.35], stim_duration: 0.08, phase: US}
      ACh:   {stim_type: ramp,    poisson_rate: 0.02,  peak_df: [0.10, 0.20], stim_duration: 20,   phase: recovery}
      Oxy:   {stim_type: ramp,    poisson_rate: 0.005, peak_df: [0.02, 0.05], stim_duration: 30,   phase: recovery}

  # ==================== 认知类 (4) ====================

  cognitive_attention:
    description: "注意力集中 - ACh 持续高 (Sarter 2005)"
    paradigm: "Sustained attention task"
    behavior: "attentional_engagement"
    brain_region: "PFC"
    expected_state: {pleasure: medium, arousal: high, dominance: medium}
    modulators:
