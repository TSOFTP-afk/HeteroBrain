    - social_isolation
    - social_rejection
    - maternal_bonding
    - male_aggression
    - social_hierarchy_dominant
    - social_hierarchy_subordinate
    - empathy_pain_observation
    - mate_choice
    - inequity_aversion
    - cooperative_joint_action
  认知类:
