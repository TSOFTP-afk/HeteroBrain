# ============================================================================
# 合成神经调质轨迹数据集配置 v5 (72 场景 + 4 维细化 + 9 分类)
# ============================================================================
# 4 个细化维度:
#   1. 时间阶段划分: baseline → CS → US → recovery
#   2. 脑区特异性: VTA/striatum/PFC/amygdala/hippocampus/hypothalamus
#   3. 刺激强度梯度: weak / medium / strong
#   4. 行为关联标注: approach / freezing / lever_press / exploration 等
#
# 72 个场景 (9 大分类, 详见 categories 字段):
#   奖赏类 (8): reward_anticipation / delivery / omission / extinction / uncertain /
#               contrast / delay_discounting / food_vs_drug_reward
#   应激类 (8): stress_acute_looming / chronic_unpredictable / restraint / social_defeat /
#               post_restraint_recovery / ptsd_reexperiencing / cold_water / unavoidable_shock
#   社交类 (10): social_investigation / bonding / isolation / rejection / maternal_bonding /
#                male_aggression / hierarchy_dominant / hierarchy_subordinate /
#                empathy_pain_observation / mate_choice
#   认知类 (10): cognitive_attention / learning / habituation / decision / working_memory /
#                reversal_learning / episodic_encoding / episodic_retrieval /
#                risky_decision / motor_learning
#   病理类 (16): addiction_cocaine / withdrawal / depression / fear_conditioning /
#                fear_extinction / meditation_compassion / schizophrenia_pos / neg /
#                bipolar_mania / depression / anxiety / ocd / adhd / autism /
#                alcohol_intoxication / withdrawal  (全部 enabled: false)
#   生理节律类 (7): sleep_rem / sleep_nrem / circadian_morning / exercise_aerobic /
#                  hunger_state / satiety_state / sexual_arousal
#   情绪调节类 (4): emotion_reappraisal / suppression / mindfulness_breathing /
#                  emotional_memory_consolidation
#   治疗干预类 (6): ssri_treatment / benzodiazepine_acute / antipsychotic_d2_block /
#                  psilocybin_therapy / mdma_empathogen / deep_brain_stimulation  (enabled: false)
#   学习记忆类 (3): fear_reconsolidation / spatial_navigation / procedural_habit
# ============================================================================

global:
  duration_s: 300.0          # A2: 120s → 300s, 给恢复期足够时间验证恢复能力
  fs_hz: 100.0
  noise_std_scale: 1.0
  da_5ht_coupling: 0.3

# ============================================================================
